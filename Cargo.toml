[package]
name = "ghore"
version = "1.0.0"
edition = "2024"
description = "Ghore, The Chameleon"

[dependencies]
bevy = { version = "0.20", features = ["aac", "mp4"] } # m4a sound effects
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
webp = { version = "0.3", default-features = false }

# Web build (see `web/`): WebGL2 renderer, wasm-friendly Bevy internals, localStorage for saves.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", features = ["web", "webgl2"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

# Small optimization for our own code in dev builds.
[profile.dev]
opt-level = 1
debug = false # or "line-tables-only" for backtraces with line numbers
strip = "debuginfo"
incremental = true
codegen-units = 256 # max parallelism for our own crate

# Fully optimize dependencies (Bevy) even in dev builds — big FPS win, compiled once.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Release: slow to build, as small and fast as possible.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# `cargo build --profile web-release --target wasm32-unknown-unknown`: smaller download, no LTO-at-all-costs.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
