[package]
name = "camaleon"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20"

# Small optimization for our own code in dev builds.
[profile.dev]
opt-level = 1

# Fully optimize dependencies (Bevy) even in dev builds — big FPS win, compiled once.
[profile.dev.package."*"]
opt-level = 3
